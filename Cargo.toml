[package]
name = "up-wire-xcdrv2"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
up-rust = { git = "ssh://git@github.com/PLeVasseur/up-rust.git", rev = "4ea97325e6a7e45d31ef392343035a849e717bdf", default-features = false, features = ["selected-wire-user-api", "wire-implementer-api"] }
up-wire-xcdrv2-macros = { path = "macros" }

[dev-dependencies]
trybuild = "1.0.114"
up-rust = { git = "ssh://git@github.com/PLeVasseur/up-rust.git", rev = "4ea97325e6a7e45d31ef392343035a849e717bdf", default-features = false, features = ["selected-wire-user-api", "transport-implementer-api", "wire-implementer-api", "selected-wire-legacy-protobuf-metadata"] }

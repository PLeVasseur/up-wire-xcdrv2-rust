[package]
name = "up-wire-xcdrv2"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
up-rust = { git = "ssh://git@github.com/PLeVasseur/up-rust.git", rev = "dffeb6c7111f4dbe56786b6f857126b46a71c41b", default-features = false, features = ["selected-wire-user-api", "wire-implementer-api"] }
up-wire-xcdrv2-macros = { path = "macros" }

[dev-dependencies]
trybuild = "1.0.114"
up-rust = { git = "ssh://git@github.com/PLeVasseur/up-rust.git", rev = "dffeb6c7111f4dbe56786b6f857126b46a71c41b", default-features = false, features = ["selected-wire-user-api", "transport-implementer-api", "wire-implementer-api", "selected-wire-legacy-protobuf-metadata"] }

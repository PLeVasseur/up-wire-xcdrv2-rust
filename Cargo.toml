[package]
name = "up-wire-xcdrv2"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "c47f95e73efb3a95deb1a7605484ef7231451a13", default-features = false, features = ["selected-wire-user-api", "wire-implementer-api", "zero-copy-uninit"] }
up-wire-xcdrv2-macros = { path = "macros" }

[dev-dependencies]
static_assertions = "1.1"
trybuild = "1.0.114"
up-rust = { git = "https://github.com/PLeVasseur/up-rust.git", rev = "c47f95e73efb3a95deb1a7605484ef7231451a13", default-features = false, features = ["selected-wire-user-api", "transport-implementer-api", "wire-implementer-api", "selected-wire-legacy-protobuf-metadata", "zero-copy-uninit"] }

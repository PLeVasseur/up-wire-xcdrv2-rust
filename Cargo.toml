[package]
name = "up-wire-xcdrv2"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
up-rust = { git = "ssh://git@github.com/PLeVasseur/up-rust.git", rev = "eef9c445e2bdddacd6999739c83c1cd7c79a041d", default-features = false, features = ["selected-wire-user-api", "wire-implementer-api", "zero-copy-uninit"] }
up-wire-xcdrv2-macros = { path = "macros" }

[dev-dependencies]
trybuild = "1.0.114"
up-rust = { git = "ssh://git@github.com/PLeVasseur/up-rust.git", rev = "eef9c445e2bdddacd6999739c83c1cd7c79a041d", default-features = false, features = ["selected-wire-user-api", "transport-implementer-api", "wire-implementer-api", "selected-wire-legacy-protobuf-metadata", "zero-copy-uninit"] }
